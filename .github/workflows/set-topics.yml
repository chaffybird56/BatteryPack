name: Apply repository topics

on:
  push:
    branches: [main]
    paths:
      - .github/repository-topics.json
      - .github/workflows/set-topics.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  topics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set repository description and topics
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const data = JSON.parse(
              fs.readFileSync(".github/repository-topics.json", "utf8")
            );
            const { owner, repo } = context.repo;

            await github.rest.repos.update({
              owner,
              repo,
              description: data.description,
            });

            await github.request("PUT /repos/{owner}/{repo}/topics", {
              owner,
              repo,
              names: data.topics,
              headers: {
                accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28",
              },
            });

            core.info(`Updated ${owner}/${repo}: description + ${data.topics.length} topics`);
